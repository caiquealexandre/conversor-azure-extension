<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Azure-family blue gradient (not the Azure mark) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A9BF0"/>
      <stop offset="0.55" stop-color="#0F7CE0"/>
      <stop offset="1" stop-color="#005BA8"/>
    </linearGradient>
    <!-- soft top-light sheen -->
    <radialGradient id="sheen" cx="0.32" cy="0.24" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EAF3FC"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#00305c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded-square badge -->
  <rect x="6" y="6" width="116" height="116" rx="27" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="27" fill="url(#sheen)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- conversion arc: an arrow sweeping around the clock -->
  <g fill="none" stroke="#BFE0FF" stroke-width="5" stroke-linecap="round">
    <path d="M 96 44 A 40 40 0 1 1 78 30"/>
  </g>
  <path d="M 78 18 L 82 31 L 68 33 Z" fill="#BFE0FF"/>

  <!-- clock face -->
  <g filter="url(#ds)">
    <circle cx="64" cy="66" r="34" fill="url(#face)"/>
  </g>
  <circle cx="64" cy="66" r="34" fill="none" stroke="#0F7CE0" stroke-opacity="0.15" stroke-width="2"/>

  <!-- tick marks -->
  <g stroke="#0F7CE0" stroke-linecap="round">
    <line x1="64" y1="37" x2="64" y2="43" stroke-width="3.4"/>
    <line x1="64" y1="89" x2="64" y2="95" stroke-width="3.4"/>
    <line x1="35" y1="66" x2="41" y2="66" stroke-width="3.4"/>
    <line x1="87" y1="66" x2="93" y2="66" stroke-width="3.4"/>
    <g stroke="#0F7CE0" stroke-opacity="0.45" stroke-width="2.4">
      <line x1="78.5" y1="41.4" x2="75.7" y2="46.2"/>
      <line x1="88.6" y1="51.5" x2="83.8" y2="54.3"/>
      <line x1="88.6" y1="80.5" x2="83.8" y2="77.7"/>
      <line x1="78.5" y1="90.6" x2="75.7" y2="85.8"/>
      <line x1="49.5" y1="90.6" x2="52.3" y2="85.8"/>
      <line x1="39.4" y1="80.5" x2="44.2" y2="77.7"/>
      <line x1="39.4" y1="51.5" x2="44.2" y2="54.3"/>
      <line x1="49.5" y1="41.4" x2="52.3" y2="46.2"/>
    </g>
  </g>

  <!-- hands: hour to ~2, minute to ~10 -->
  <g stroke="#0A66C2" stroke-linecap="round">
    <line x1="64" y1="66" x2="80" y2="54" stroke-width="5.5"/>
    <line x1="64" y1="66" x2="47" y2="49" stroke-width="4"/>
  </g>
  <circle cx="64" cy="66" r="4.6" fill="#0A66C2"/>
  <circle cx="64" cy="66" r="1.8" fill="#EAF3FC"/>
</svg>
